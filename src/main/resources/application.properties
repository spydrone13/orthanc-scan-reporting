spring.application.name=orthanc-scan-reporting
server.port=3002

# File-backed so report data survives restarts.
spring.datasource.url=jdbc:h2:file:./data/orthanc-reporting
spring.jpa.hibernate.ddl-auto=update

# Override in the git-ignored application-secrets.properties.
spring.config.import=optional:classpath:application-secrets.properties
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# One consumer keeps each lot's events in order; failures go to the dead-letter queue instead of looping.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.lots.exchange=orthanc.lots
app.reporting.queue=orthanc.lots.reporting
app.reporting.dead-letter-queue=orthanc.lots.reporting.dlq
# orthanc-scan-consumer, read once on first start to load the lots that already exist.
app.reporting.consumer-base-url=http://localhost:3001
app.reporting.seed-on-startup=true
